name: Mindcircuit Book Store AWS Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-scan:
    name: Lint & Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Test App Dependencies
        run: |
          cd app/api
          npm install
          npm test

      - name: Infrastructure Security Audit (IaC Scan)
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: infrastructure/
          framework: terraform
          soft_fail: true

  deploy-staging:
    name: Deploy to Staging ASGs
    needs: lint-and-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Secrets Configuration
        id: check_aws
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS Credentials missing. Skipping instance refresh step gracefully."
            echo "has_credentials=false" >> $GITHUB_OUTPUT
          else
            echo "AWS Credentials detected."
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        if: steps.check_aws.outputs.has_credentials == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Trigger Rolling Instance Refresh (FE-ASG & BE-ASG)
        if: steps.check_aws.outputs.has_credentials == 'true'
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name FE-ASG \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}' || true
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name BE-ASG \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}' || true
