# ==============================================================================
# Mindcircuit Book Store - Nginx / Apache Presentation Tier Proxy Config
# Public Frontend: virat.rebel7781.xyz | Backend API Target: api.rebel7781.xyz
# Author: Tarra Someswararao
# ==============================================================================
server {
    listen 80 default_server;
    server_name virat.rebel7781.xyz _;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health Check Endpoint for Load Balancer Target Group
    location /healthz {
        access_log off;
        return 200 '{"status":"UP","tier":"Presentation Tier (FE-ASG)","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Reverse Proxy to Internal Backend ALB / API Tier
    location /api/ {
        proxy_pass http://api.rebel7781.xyz/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Presentation Web Assets
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
